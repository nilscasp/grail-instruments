<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grail Instruments</title>
<style>
  :root { --tinte: #1d1d1b; }
  html, body { margin: 0; height: 100%; background: #8c1030; }
  .hero { position: relative; min-height: 100svh; display: grid; place-items: center; overflow: hidden;
    /* Standbild, falls WebGL fehlt */
    background:
      radial-gradient(60% 60% at 62% 0%, #f6e6d6 0%, rgba(246,230,214,0) 70%),
      radial-gradient(50% 55% at 88% 18%, #c79bbd 0%, rgba(199,155,189,0) 70%),
      radial-gradient(70% 80% at 8% 40%, #f5961c 0%, rgba(245,150,28,0) 70%),
      radial-gradient(70% 60% at 0% 100%, #2a0805 0%, rgba(42,8,5,0) 60%),
      #a0122f; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .logo { position: relative; width: min(52vw, 46svh, 420px); color: var(--tinte); }
  .logo svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<section class="hero">
  <canvas id="fluid" aria-hidden="true"></canvas>
  <div class="logo" id="logo" role="img" aria-label="Grail Instruments"></div>
</section>
<script>
// Logo als Inline-SVG (nimmt die Textfarbe an)
fetch('aktuell/grail-logo-currentcolor.svg').then(r => r.text()).then(t => document.getElementById('logo').innerHTML = t);

// Fluid: weiche Farbfelder, die durch ein langsames Strömungsfeld verschoben werden. Keine Mausreaktion.
// Tempo über ?tempo=… (1 = Standard). Bei „Bewegung reduzieren“ bleibt das Bild stehen.
const tempo = +(new URLSearchParams(location.search).get('tempo') ?? 1);
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv = document.getElementById('fluid');
const gl = cv.getContext('webgl', { antialias: false, premultipliedAlpha: false });
if (gl) {
  const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
  const fs = `precision highp float;
  uniform vec2 res; uniform float t;
  // Wertrauschen + fbm
  float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
    return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
  float fbm(vec2 p){ float v = 0., a = .5; for (int i = 0; i < 5; i++){ v += a * n(p); p = p * 2.03 + 17.1; a *= .5; } return v; }
  // ein Farbfeld: Gewicht nach Abstand
  void feld(inout vec3 acc, inout float w, vec2 q, vec2 c, float s, vec3 col){
    float g = exp(-dot(q - c, q - c) / (s * s)); acc += col * g; w += g; }
  void main(){
    vec2 uv = gl_FragCoord.xy / res; uv.y = 1. - uv.y;
    float asp = res.x / res.y;
    vec2 q = vec2((uv.x - .5) * max(asp, 1.) + .5, (uv.y - .5) / min(asp, 1.) + .5);
    // langsames Strömungsfeld (doppelt verzerrtes Rauschen)
    vec2 a = vec2(fbm(q * 1.4 + vec2(0., t * .9)), fbm(q * 1.4 + vec2(5.2, -t * .7)));
    vec2 b = vec2(fbm(q * 1.1 + 2.2 * a + vec2(1.7, 9.2) + t * .35), fbm(q * 1.1 + 2.2 * a + vec2(8.3, 2.8) - t * .3));
    vec2 w2 = q + .34 * (b - .5);
    // Farbfelder, Lage wie im Grail-Bild, jede driftet sehr langsam
    vec3 acc = vec3(0.); float w = 0.;
    feld(acc, w, w2, vec2(.10 + .05*sin(t*1.3), .42 + .06*cos(t*1.1)), .42, vec3(.961, .588, .110)); // Orange
    feld(acc, w, w2, vec2(.30 + .04*cos(t*.9), .08 + .04*sin(t*1.2)), .30, vec3(.985, .700, .300)); // Goldorange
    feld(acc, w, w2, vec2(.62 + .05*sin(t*.8), -.02 + .04*cos(t)), .30, vec3(.965, .905, .850)); // Creme
    feld(acc, w, w2, vec2(.88 + .04*cos(t*1.1), .16 + .05*sin(t*.7)), .26, vec3(.780, .600, .740)); // Flieder
    feld(acc, w, w2, vec2(.92 + .05*sin(t*.6), .62 + .06*cos(t*.9)), .40, vec3(.640, .060, .190)); // Karmin
    feld(acc, w, w2, vec2(.55 + .06*cos(t*.7), .80 + .05*sin(t*1.05)), .38, vec3(.560, .040, .160)); // Weinrot
    feld(acc, w, w2, vec2(-.05 + .04*sin(t*.5), 1.02 + .04*cos(t*.8)), .30, vec3(.150, .040, .020)); // Dunkel
    vec3 col = acc / max(w, 1e-4);
    // feine Körnung wie im Original
    float g = h(gl_FragCoord.xy + floor(t * 40.)) - .5;
    col += g * .055;
    gl_FragColor = vec4(col, 1.);
  }`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const uRes = gl.getUniformLocation(pr, 'res'), uT = gl.getUniformLocation(pr, 't');
  const resize = () => { const d = Math.min(devicePixelRatio || 1, 1.5); cv.width = cv.clientWidth * d; cv.height = cv.clientHeight * d; gl.viewport(0, 0, cv.width, cv.height); };
  addEventListener('resize', resize); resize();
  const t0 = performance.now() - 20000; // nicht im Startzustand beginnen
  const frame = now => {
    gl.uniform2f(uRes, cv.width, cv.height);
    gl.uniform1f(uT, (now - t0) / 1000 * 0.045 * tempo); // sehr langsam
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!still) requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
