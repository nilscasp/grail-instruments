<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Farbflächen anpassen</title>
<style>
  body { margin: 0; padding: 16px; font: 13px system-ui, sans-serif; background: #222; color: #eee; }
  .reihe { display: flex; gap: 12px; flex-wrap: wrap; }
  figure { margin: 0; } figcaption { opacity: .7; }
  canvas { width: 300px; height: auto; image-rendering: auto; }
  pre { white-space: pre-wrap; font-size: 11px; }
</style>
</head>
<body>
<div class="reihe">
  <figure><canvas id="ziel"></canvas><figcaption>Verlauf aus dem Bild</figcaption></figure>
  <figure><canvas id="fit"></canvas><figcaption>aus Farbflächen</figcaption></figure>
  <figure><canvas id="diff"></canvas><figcaption>Abweichung ×8</figcaption></figure>
  <figure><canvas id="punkte"></canvas><figcaption>Flächen (Mitte, Ausdehnung)</figcaption></figure>
</div>
<pre id="out">rechnet …</pre>
<script type="module">
// Zerlegt den Farbverlauf (aktuell/grail-stahl-farben.png) in N weiche, gedrehte Ellipsen-Flächen.
// Mischung: Farbe = Σ wᵢ·cᵢ / Σ wᵢ, wᵢ = exp(-qᵢ), qᵢ = (u/sx)² + (v/sy)² im gedrehten Rahmen der Fläche.
// Geometrie per Bergsteigen, Farben je Schritt per kleinster Quadrate (auf 0..1 begrenzt).
// Ergebnis: ../aktuell/grail-flaechen.json (vom Hero gelesen).
const N = +(new URLSearchParams(location.search).get('n') ?? 9), G = 64;
const img = new Image(); img.src = '../aktuell/grail-stahl-farben.png'; await img.decode();
const GH = Math.round(G * img.naturalHeight / img.naturalWidth);
const zc = document.getElementById('ziel'); zc.width = G; zc.height = GH;
const zx = zc.getContext('2d', { willReadFrequently: true }); zx.imageSmoothingQuality = 'high'; zx.drawImage(img, 0, 0, G, GH);
const zd = zx.getImageData(0, 0, G, GH).data;
const P = G * GH, T = new Float32Array(P * 3), X = new Float32Array(P), Y = new Float32Array(P);
for (let i = 0; i < P; i++) { T[i * 3] = zd[i * 4] / 255; T[i * 3 + 1] = zd[i * 4 + 1] / 255; T[i * 3 + 2] = zd[i * 4 + 2] / 255; X[i] = (i % G + .5) / G; Y[i] = ((i / G | 0) + .5) / GH; }

// Start: Flächen auf einem Raster, Größe passend
let F = Array.from({ length: N }, (_, k) => {
  const c = Math.ceil(Math.sqrt(N)), gx = k % c, gy = k / c | 0;
  return { x: (gx + .5) / c, y: (gy + .5) / Math.ceil(N / c), sx: .28, sy: .28, a: 0, c: [.5, .5, .5] };
});

const Wbuf = new Float32Array(P * N);
function gewichte(F) {
  for (let i = 0; i < P; i++) {
    let qmin = 1e9; const q = new Float32Array(N);
    for (let k = 0; k < N; k++) {
      const f = F[k], dx = X[i] - f.x, dy = Y[i] - f.y, ca = Math.cos(f.a), sa = Math.sin(f.a);
      const u = (dx * ca + dy * sa) / f.sx, v = (-dx * sa + dy * ca) / f.sy;
      q[k] = u * u + v * v; if (q[k] < qmin) qmin = q[k];
    }
    let s = 0; for (let k = 0; k < N; k++) { const w = Math.exp(-(q[k] - qmin)); Wbuf[i * N + k] = w; s += w; }
    for (let k = 0; k < N; k++) Wbuf[i * N + k] /= s;
  }
}
// Farben per kleinster Quadrate: (WᵀW + λI) C = WᵀT
function farben(F) {
  const A = new Float64Array(N * N), B = new Float64Array(N * 3), lam = 1e-4;
  for (let i = 0; i < P; i++) for (let k = 0; k < N; k++) {
    const wk = Wbuf[i * N + k]; if (wk < 1e-6) continue;
    for (let l = 0; l < N; l++) A[k * N + l] += wk * Wbuf[i * N + l];
    B[k * 3] += wk * T[i * 3]; B[k * 3 + 1] += wk * T[i * 3 + 1]; B[k * 3 + 2] += wk * T[i * 3 + 2];
  }
  for (let k = 0; k < N; k++) A[k * N + k] += lam;
  // Gauß-Elimination
  const M = Array.from({ length: N }, (_, r) => [...A.slice(r * N, r * N + N), B[r * 3], B[r * 3 + 1], B[r * 3 + 2]]);
  for (let c = 0; c < N; c++) {
    let p = c; for (let r = c + 1; r < N; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]];
    for (let r = 0; r < N; r++) if (r !== c) { const f = M[r][c] / M[c][c]; for (let j = c; j < N + 3; j++) M[r][j] -= f * M[c][j]; }
  }
  for (let k = 0; k < N; k++) F[k].c = [0, 1, 2].map(j => Math.min(1, Math.max(0, M[k][N + j] / M[k][k])));
}
function fehler(F) {
  let e = 0;
  for (let i = 0; i < P; i++) for (let j = 0; j < 3; j++) {
    let v = 0; for (let k = 0; k < N; k++) v += Wbuf[i * N + k] * F[k].c[j];
    const d = v - T[i * 3 + j]; e += d * d;
  }
  return e;
}
const bewerte = F => { gewichte(F); farben(F); return fehler(F); };
const kopie = F => F.map(f => ({ ...f, c: [...f.c] }));

let best = bewerte(F), temp = .02;
const ITER = 3500;
for (let it = 0; it < ITER; it++) {
  const C = kopie(F), k = Math.random() * N | 0, f = C[k], s = .08 * (1 - it / ITER) + .01;
  const r = Math.random();
  if (r < .4) { f.x += (Math.random() - .5) * s; f.y += (Math.random() - .5) * s; }
  else if (r < .8) { f.sx *= Math.exp((Math.random() - .5) * s * 4); f.sy *= Math.exp((Math.random() - .5) * s * 4); }
  else f.a += (Math.random() - .5) * s * 8;
  f.sx = Math.min(1.2, Math.max(.06, f.sx)); f.sy = Math.min(1.2, Math.max(.06, f.sy));
  f.x = Math.min(1.3, Math.max(-.3, f.x)); f.y = Math.min(1.3, Math.max(-.3, f.y));
  const e = bewerte(C);
  if (e < best || Math.random() < Math.exp((best - e) / (temp * best))) { F = C; best = e; }
  temp *= .998;
  if (it % 250 === 0) { document.getElementById('out').textContent = `Schritt ${it}/${ITER}, Abweichung ${(Math.sqrt(best / (P * 3)) * 255).toFixed(2)} Tonwerte`; await new Promise(r => setTimeout(r)); }
}
best = bewerte(F);
const rmse = Math.sqrt(best / (P * 3)) * 255;

// Bilder zeichnen
const zeichne = (id, fn, w = G, h = GH) => { const c = document.getElementById(id); c.width = w; c.height = h; const x = c.getContext('2d'); const d = x.createImageData(w, h); for (let i = 0; i < w * h; i++) d.data.set([...fn(i), 255], i * 4); x.putImageData(d, 0, 0); return x; };
const fitPx = i => [0, 1, 2].map(j => { let v = 0; for (let k = 0; k < N; k++) v += Wbuf[i * N + k] * F[k].c[j]; return v; });
zeichne('fit', i => fitPx(i).map(v => v * 255));
zeichne('diff', i => fitPx(i).map((v, j) => 128 + (v - T[i * 3 + j]) * 255 * 8));
const px = zeichne('punkte', i => fitPx(i).map(v => v * 255));
px.lineWidth = .6;
for (const f of F) { px.strokeStyle = '#fff'; px.beginPath(); px.ellipse(f.x * G, f.y * GH, f.sx * G, f.sy * GH, f.a, 0, 2 * Math.PI); px.stroke(); px.fillStyle = '#fff'; px.fillRect(f.x * G - 1, f.y * GH - 1, 2, 2); }

const r3 = v => Math.round(v * 1000) / 1000;
const json = { quelle: 'aktuell/grail-stahl-farben.png', abweichungTonwerte: +rmse.toFixed(2), flaechen: F.map(f => ({ x: r3(f.x), y: r3(f.y), sx: r3(f.sx), sy: r3(f.sy), a: r3(f.a), farbe: '#' + f.c.map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join('') })) };
const res = await fetch('/speichern/aktuell/grail-flaechen.json', { method: 'PUT', body: JSON.stringify(json, null, 1) });
document.getElementById('out').textContent = `Fertig: Abweichung ${rmse.toFixed(2)} Tonwerte (von 255). ${await res.text()}\n` + JSON.stringify(json, null, 1);
window.__fertig = json;
</script>
</body>
</html>
